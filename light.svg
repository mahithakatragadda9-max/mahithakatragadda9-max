<svg width="1180" height="610" viewBox="0 0 1180 610"
xmlns="http://www.w3.org/2000/svg">

<defs>


<!-- =========================
     LIGHT ACCENT GRADIENT
========================= -->

<linearGradient id="accent"
x1="0%"
y1="0%"
x2="100%"
y2="0%">

<stop offset="0%" stop-color="#2563EB">

<animate
attributeName="stop-color"
values="#2563EB;#06B6D4;#10B981;#2563EB"
dur="8s"
repeatCount="indefinite"/>

</stop>


<stop offset="50%"
stop-color="#06B6D4">

<animate
attributeName="stop-color"
values="#06B6D4;#10B981;#2563EB;#06B6D4"
dur="8s"
repeatCount="indefinite"/>

</stop>


<stop offset="100%"
stop-color="#10B981">

<animate
attributeName="stop-color"
values="#10B981;#2563EB;#06B6D4;#10B981"
dur="8s"
repeatCount="indefinite"/>

</stop>


</linearGradient>




<!-- ASCII BLUE CYAN -->

<linearGradient
id="asciiGlow"
x1="0%"
y1="0%"
x2="100%"
y2="0%">


<stop offset="0%"
stop-color="#2563EB"/>


<stop offset="50%"
stop-color="#06B6D4"/>


<stop offset="100%"
stop-color="#2563EB"/>


<animateTransform
attributeName="gradientTransform"
type="translate"
from="-1 0"
to="1 0"
dur="5s"
repeatCount="indefinite"/>


</linearGradient>





<!-- GLASS -->

<linearGradient
id="glass"
x1="0%"
y1="0%"
x2="0%"
y2="100%">


<stop offset="0%"
stop-color="#FFFFFF"
stop-opacity=".8"/>


<stop offset="100%"
stop-color="#F8FAFC"
stop-opacity=".3"/>


</linearGradient>





<!-- BACKGROUND GLOWS -->


<radialGradient id="blue">

<stop offset="0%"
stop-color="#2563EB"
stop-opacity=".15"/>

<stop offset="100%"
stop-color="#2563EB"
stop-opacity="0"/>

</radialGradient>



<radialGradient id="cyan">

<stop offset="0%"
stop-color="#06B6D4"
stop-opacity=".12"/>

<stop offset="100%"
stop-color="#06B6D4"
stop-opacity="0"/>

</radialGradient>





<!-- FILTERS -->


<filter id="softGlow">

<feGaussianBlur
stdDeviation="5"
result="blur"/>

<feMerge>

<feMergeNode in="blur"/>

<feMergeNode in="SourceGraphic"/>

</feMerge>

</filter>




<filter id="noise">

<feTurbulence
type="fractalNoise"
baseFrequency=".8"
numOctaves="2"/>

<feBlend
mode="soft-light"
in2="SourceGraphic"/>

</filter>




<clipPath id="round">

<rect
width="1180"
height="610"
rx="40"/>

</clipPath>


</defs>




<!-- =========================
     BACKGROUND
========================= -->


<g clip-path="url(#round)">



<rect
width="1180"
height="610"
fill="#FFFFFF"/>




<!-- SOFT FLOATING GLOW -->


<circle
cx="130"
cy="100"
r="280"
fill="url(#blue)">

<animateTransform
attributeName="transform"
type="translate"
values="0 0;40 20;0 0"
dur="12s"
repeatCount="indefinite"/>

</circle>




<circle
cx="1000"
cy="500"
r="300"
fill="url(#cyan)">

<animateTransform
attributeName="transform"
type="translate"
values="0 0;-30 -20;0 0"
dur="14s"
repeatCount="indefinite"/>

</circle>




<!-- MAIN CARD -->


<rect
x="25"
y="25"
width="1130"
height="560"
rx="35"
fill="#F8FAFC"
stroke="#E2E8F0"/>




<!-- BORDER ANIMATION -->


