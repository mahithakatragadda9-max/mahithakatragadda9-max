x="25"
y="25"
width="1130"
height="560"
rx="35"
fill="none"
stroke="url(#accent)"
stroke-width="2">


<animate
attributeName="opacity"
values=".3;1;.3"
dur="4s"
repeatCount="indefinite"/>


</rect>





<!-- LEFT PANEL -->


