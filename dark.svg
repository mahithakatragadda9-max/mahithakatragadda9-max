<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 610" width="100%" height="100%">
  <defs>
    <!-- Fonts -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Plus+Jakarta+Sans:wght@400;600;800&amp;display=swap');
      
      .title { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 800; font-size: 32px; fill: #F8FAFC; }
      .subtitle { font-family: 'JetBrains+Mono', monospace; font-weight: 700; font-size: 20px; fill: #7C3AED; }
      .label { font-family: 'JetBrains+Mono', monospace; font-weight: 700; font-size: 14px; fill: #94A3B8; }
      .value { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 600; font-size: 15px; fill: #F8FAFC; }
      .pill-text { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 600; font-size: 12px; fill: #E2E8F0; }
      .terminal-top-text { font-family: 'JetBrains+Mono', monospace; font-size: 12px; fill: #64748B; }
      
      /* Smooth Floating Animation */
      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0px); }
      }
      .floating-art { animation: float 6s ease-in-out infinite; }
    </style>

    <!-- Clip Path for Rounding the Profile Image Area -->
    <clipPath id="avatarClip">
      <circle cx="240" cy="270" r="130" />
    </clipPath>

    <!-- Theme Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="100%" stop-color="#0B1329" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED">
        <animate attributeName="stop-color" values="#7C3AED;#22D3EE;#10B981;#7C3AED" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#22D3EE">
        <animate attributeName="stop-color" values="#22D3EE;#10B981;#7C3AED;#22D3EE" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="panelBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>

    <!-- Noise Pattern Grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1180" height="610" rx="24" fill="url(#bgGrad)" stroke="url(#panelBorder)" stroke-width="2"/>
  <rect width="1180" height="610" rx="24" fill="url(#grid)"/>

  <!-- Ambient Decorative Background Glows -->
  <circle cx="200" cy="150" r="180" fill="#7C3AED" fill-opacity="0.15" filter="url(#softGlow)">
    <animate attributeName="cx" values="200;250;200" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle cx="950" cy="450" r="220" fill="#22D3EE" fill-opacity="0.12" filter="url(#softGlow)">
    <animate attributeName="cy" values="450;380;450" dur="12s" repeatCount="indefinite"/>
  </circle>

  <!-- Moving Ambient Scanline -->
  <line x1="0" y1="0" x2="1180" y2="0" stroke="#ffffff" stroke-opacity="0.02" stroke-width="4">
    <animate attributeName="y1" values="0;610;0" dur="8s" repeatCount="indefinite" />
    <animate attributeName="y2" values="0;610;0" dur="8s" repeatCount="indefinite" />
  </line>

  <!-- ================= LEFT SIDE: HOVERING GLASS AVATAR FRAME ================= -->
  <g class="floating-art">
    <!-- Outer Premium Rotating Gradient Ring -->
    <circle cx="240" cy="270" r="145" fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-dasharray="12 8" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" from="0 240 270" to="360 240 270" dur="20s" repeatCount="indefinite" />
    </circle>
    
    <!-- Subtle Inner Backdrop Frame Glow -->
    <circle cx="240" cy="270" r="134" fill="none" stroke="#22D3EE" stroke-width="2" opacity="0.4" filter="url(#glow)"/>

    <!-- Pixel Matrix Avatar Layer -->
    <g clip-path="url(#avatarClip)">
      <circle cx="240" cy="270" r="130" fill="#070A13" />
      
      <!-- Base profile photo behind the pixels for shape definition -->
      <image href="profile.jpg" x="110" y="140" width="260" height="260" preserveAspectRatio="xMidYMid slice" opacity="0.25"/>
      
      <!-- Blinking Digital Pixel Grid Overlay -->
      <g transform="translate(110, 140)" fill="url(#accentGrad)">
        <!-- Row 1 -->
        <rect x="40" y="30" width="12" height="12" opacity="0.6"><animate attributeName="opacity" values="0.6;0.2;0.9;0.6" dur="3s" repeatCount="indefinite" begin="0.1s"/></rect>
        <rect x="70" y="30" width="12" height="12" opacity="0.8"><animate attributeName="opacity" values="0.8;0.3;1;0.8" dur="2.5s" repeatCount="indefinite" begin="0.5s"/></rect>
        <rect x="130" y="30" width="12" height="12" opacity="0.5"><animate attributeName="opacity" values="0.5;1;0.2;0.5" dur="4s" repeatCount="indefinite" begin="1.2s"/></rect>
        <rect x="190" y="30" width="12" height="12" opacity="0.7"><animate attributeName="opacity" values="0.7;0.1;0.8;0.7" dur="3.2s" repeatCount="indefinite" begin="0.8s"/></rect>
        
        <!-- Row 2 -->
        <rect x="55" y="60" width="12" height="12" opacity="0.9"><animate attributeName="opacity" values="0.9;0.4;0.9" dur="2s" repeatCount="indefinite" begin="0.3s"/></rect>
        <rect x="100" y="60" width="12" height="12" opacity="0.4"><animate attributeName="opacity" values="0.4;0.9;0.1;0.4" dur="3.5s" repeatCount="indefinite" begin="1.5s"/></rect>
        <rect x="115" y="60" width="12" height="12" opacity="0.8"><animate attributeName="opacity" values="0.8;0.2;0.9;0.8" dur="2.8s" repeatCount="indefinite" begin="0.7s"/></rect>
        <rect x="160" y="60" width="12" height="12" opacity="0.6"><animate attributeName="opacity" values="0.6;1;0.3;0.6" dur="3.9s" repeatCount="indefinite" begin="1.1s"/></rect>
        
        <!-- Row 3 (Eye Level Clusters) -->
        <rect x="40" y="100" width="16" height="16" opacity="0.9"><animate attributeName="opacity" values="0.9;0.3;1;0.9" dur="1.8s" repeatCount="indefinite" begin="0s"/></rect>
        <rect x="80" y="100" width="16" height="16" opacity="0.5"><animate attributeName="opacity" values="0.5;1;0.2;0.5" dur="4.2s" repeatCount="indefinite" begin="2s"/></rect>
        <rect x="140" y="100" width="16" height="16" opacity="0.8"><animate attributeName="opacity" values="0.8;0.2;0.9;0.8" dur="2.2s" repeatCount="indefinite" begin="0.4s"/></rect>
        <rect x="200" y="100" width="16" height="16" opacity="0.7"><animate attributeName="opacity" values="0.7;0.9;0.3;0.7" dur="3s" repeatCount="indefinite" begin="1.3s"/></rect>
        
        <!-- Row 4 -->
        <rect x="70" y="140" width="14" height="14" opacity="0.4"><animate attributeName="opacity" values="0.4;0.8;0.1;0.4" dur="3.1s" repeatCount="indefinite" begin="0.9s"/></rect>
        <rect x="110" y="140" width="14" height="14" opacity="0.9"><animate attributeName="opacity" values="0.9;0.3;1;0.9" dur="2.4s" repeatCount="indefinite" begin="0.2s"/></rect>
        <rect x="130" y="140" width="14" height="14" opacity="0.6"><animate attributeName="opacity" values="0.6;1;0.2;0.6" dur="3.7s" repeatCount="indefinite" begin="1.7s"/></rect>
        
        <!-- Row 5 (Mouth/Chin Level) -->
        <rect x="85" y="180" width="12" height="12" opacity="0.8"><animate attributeName="opacity" values="0.8;0.1;0.9;0.8" dur="2.9s" repeatCount="indefinite" begin="0.6s"/></rect>
        <rect x="110" y="180" width="35" height="10" opacity="0.7"><animate attributeName="opacity" values="0.7;1;0.3;0.7" dur="2.1s" repeatCount="indefinite" begin="1.1s"/></rect>
        <rect x="160" y="180" width="12" height="12" opacity="0.5"><animate attributeName="opacity" values="0.5;0.9;0.2;0.5" dur="3.4s" repeatCount="indefinite" begin="0.5s"/></rect>
        
        <!-- Row 6 (Base) -->
        <rect x="50" y="215" width="15" height="15" opacity="0.6"><animate attributeName="opacity" values="0.6;0.2;0.8;0.6" dur="4.5s" repeatCount="indefinite" begin="2.3s"/></rect>
        <rect x="105" y="215" width="15" height="15" opacity="0.9"><animate attributeName="opacity" values="0.9;0.4;1;0.9" dur="2.7s" repeatCount="indefinite" begin="0s"/></rect>
        <rect x="175" y="215" width="15" height="15" opacity="0.4"><animate attributeName="opacity" values="0.4;1;0.2;0.4" dur="3.3s" repeatCount="indefinite" begin="1.6s"/></rect>
      </g>

      <!-- Matrix Scan Grid lines -->
      <g opacity="0.25">
        <line x1="110" y1="165" x2="370" y2="165" stroke="#fff" stroke-width="1.5" stroke-dasharray="2 3"/>
        <line x1="110" y1="195" x2="370" y2="195" stroke="#fff" stroke-width="1.5" stroke-dasharray="2 3"/>
        <line x1="110" y1="225" x2="370" y2="225" stroke="#fff" stroke-width="1.5" stroke-dasharray="2 3"/>
        <line x1="110" y1="255" x2="370" y2="255" stroke="#fff" stroke-width="1.5" stroke-dasharray="2 3"/>
        <line x1="110" y1="285" x2="370" y2="285" stroke="#fff" stroke-width="1.5" stroke-dasharray="2 3"/>
        <line x1="110" y1="315" x2="370" y2="315" stroke="#fff" stroke-width="1.5" stroke-dasharray="2 3"/>
        <line x1="110" y1="345" x2="370" y2="345" stroke="#fff" stroke-width="1.5" stroke-dasharray="2 3"/>
      </g>
    </g>

    <!-- Glowing Cyber Label Badge Below Image -->
    <rect x="160" y="440" width="160" height="32" rx="16" fill="#0F172A" fill-opacity="0.85" stroke="url(#accentGrad)" stroke-width="1.5" filter="url(#glow)"/>
    <text x="240" y="461" font-family="'JetBrains+Mono', monospace" font-size="12" fill="#22D3EE" font-weight="bold" text-anchor="middle">MAHITHA_CORE_v1.0</text>
  </g>

  <!-- ================= RIGHT SIDE: TERMINAL CONTENT ================= -->
  <g transform="translate(460, 45)">
    <rect width="675" height="520" rx="16" fill="#0F172A" fill-opacity="0.75" stroke="url(#panelBorder)" stroke-width="1.5" />
    <circle cx="25" cy="24" r="6" fill="#EF4444" />
    <circle cx="45" cy="24" r="6" fill="#F59E0B" />
    <circle cx="65" cy="24" r="6" fill="#10B981" />
    <text x="337" y="28" text-anchor="middle" class="terminal-top-text">mahithakatragadda / README.md</text>
    <line x1="0" y1="48" x2="675" y2="48" stroke="url(#panelBorder)" stroke-width="1" />

    <g transform="translate(35, 90)">
      <text x="0" y="0" class="title">Hi 👋 I'm Mahitha Katragadda</text>
      
      <g transform="translate(0, 35)">
        <text x="0" y="0" class="subtitle">
          <animate attributeName="visibility" from="hidden" to="visible" begin="0s" />
          <animate attributeName="text" values=";B;;B.T;;B.Te;;B.Tech;;B.Tech C;;B.Tech CSE;;B.Tech CSE (;;B.Tech CSE (AI;;B.Tech CSE (AI &amp;;B.Tech CSE (AI &amp; M;;B.Tech CSE (AI &amp; ML) S;;B.Tech CSE (AI &amp; ML) Stud;;B.Tech CSE (AI &amp; ML) Student" dur="3s" fill="freeze" />
        </text>
        <rect x="330" y="-18" width="8" height="22" fill="#7C3AED">
          <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite" />
          <animate attributeName="x" values="0;330" dur="3s" fill="freeze" />
        </rect>
      </g>

      <g transform="translate(0, 85)" opacity="0">
        <animate attributeName="opacity" to="1" begin="1.5s" dur="0.6s" fill="freeze"/>
        <text x="0" y="0" class="label">Origin:</text>
        <text x="140" y="0" class="value">Visakhapatnam, Andhra Pradesh, India</text>
      </g>
      
      <g transform="translate(0, 115)" opacity="0">
        <animate attributeName="opacity" to="1" begin="1.8s" dur="0.6s" fill="freeze"/>
        <text x="0" y="0" class="label">Education:</text>
        <text x="140" y="0" class="value">Anil Neerukonda Institute of Technology &amp; Sciences</text>
      </g>

      <g transform="translate(0, 145)" opacity="0">
        <animate attributeName="opacity" to="1" begin="2.1s" dur="0.6s" fill="freeze"/>
        <text x="0" y="0" class="label">Current Focus:</text>
        <text x="140" y="0" class="value" fill="url(#accentGrad)">Building Intelligent Software &amp; AI Agents</text>
      </g>

      <!-- Skills -->
      <g transform="translate(0, 195)" opacity="0">
        <animate attributeName="opacity" to="1" begin="2.5s" dur="0.8s" fill="freeze"/>
        <text x="0" y="0" class="label" fill="#64748B">SKILLS &amp; TECHNOLOGIES</text>
        <g transform="translate(0, 20)">
          <g transform="translate(0, 0)"><rect width="78" height="28" rx="8" fill="#1E293B" stroke="url(#panelBorder)" stroke-width="1.5"/><circle cx="14" cy="14" r="4" fill="#38BDF8" /><text x="26" y="18" class="pill-text">Python</text></g>
          <g transform="translate(88, 0)"><rect width="136" height="28" rx="8" fill="#1E293B" stroke="url(#panelBorder)" stroke-width="1.5"/><circle cx="14" cy="14" r="4" fill="#A78BFA" /><text x="26" y="18" class="pill-text">Machine Learning</text></g>
          <g transform="translate(234, 0)"><rect width="68" height="28" rx="8" fill="#1E293B" stroke="url(#panelBorder)" stroke-width="1.5"/><circle cx="14" cy="14" r="4" fill="#34D399" /><text x="26" y="18" class="pill-text">Flask</text></g>
          <g transform="translate(312, 0)"><rect width="84" height="28" rx="8" fill="#1E293B" stroke="url(#panelBorder)" stroke-width="1.5"/><circle cx="14" cy="14" r="4" fill="#FB923C" /><text x="26" y="18" class="pill-text">OpenCV</text></g>
          <g transform="translate(406, 0)"><rect width="64" height="28" rx="8" fill="#1E293B" stroke="url(#panelBorder)" stroke-width="1.5"/><circle cx="14" cy="14" r="4" fill="#F472B6" /><text x="26" y="18" class="pill-text">Java</text></g>
        </g>
        <g transform="translate(0, 60)">
          <g transform="translate(0, 0)"><rect width="70" height="28" rx="8" fill="#1E293B" stroke="url(#panelBorder)" stroke-width="1.5"/><circle cx="14" cy="14" r="4" fill="#FBBF24" /><text x="26" y="18" class="pill-text">LLMs</text></g>
          <g transform="translate(80, 0)"><rect width="65" height="28" rx="8" fill="#1E293B" stroke="url(#panelBorder)" stroke-width="1.5"/><circle cx="14" cy="14" r="4" fill="#22D3EE" /><text x="26" y="18" class="pill-text">RAG</text></g>
          <g transform="translate(155, 0)"><rect width="94" height="28" rx="8" fill="#1E293B" stroke="url(#panelBorder)" stroke-width="1.5"/><circle cx="14" cy="14" r="4" fill="#EC4899" /><text x="26" y="18" class="pill-text">AI Agents</text></g>
          <g transform="translate(259, 0)"><rect width="106" height="28" rx="8" fill="#1E293B" stroke="url(#panelBorder)" stroke-width="1.5"/><circle cx="14" cy="14" r="4" fill="#94A3B8" /><text x="26" y="18" class="pill-text">Git &amp; GitHub</text></g>
          <g transform="translate(375, 0)"><rect width="112" height="28" rx="8" fill="#1E293B" stroke="url(#panelBorder)" stroke-width="1.5"/><circle cx="14" cy="14" r="4" fill="#22C55E" /><text x="26" y="18" class="pill-text">Data Science</text></g>
        </g>
      </g>

      <!-- Social Links Row -->
      <g transform="translate(0, 325)" opacity="0">
        <animate attributeName="opacity" to="1" begin="3.2s" dur="0.8s" fill="freeze"/>
        <line x1="0" y1="0" x2="605" y2="0" stroke="url(#panelBorder)" stroke-width="1" />
        <g transform="translate(0, 20)">
          <circle cx="16" cy="16" r="16" fill="#1E293B" stroke="url(#panelBorder)" stroke-width="1"/>
          <path d="M12 11h2.5v10H12zM13.25 7a1.5 1.5 0 100 3 1.5 1.5 0 000-3zM16.5 11H19v1.5h.1c.3-.6 1.2-1.3 2.4-1.3 2.5 0 3 1.6 3 3.8V21h-2.5v-4.2c0-1-.1-2.3-1.4-2.3-1.4 0-1.6 1.1-1.6 2.2V21H16.5z" fill="#94A3B8" transform="scale(0.8) translate(4, 4)"/>
          <text x="44" y="21" class="value" font-size="13" fill="#94A3B8">LinkedIn</text>
        </g>
        <g transform="translate(150, 20)">
          <circle cx="16" cy="16" r="16" fill="#1E293B" stroke="url(#panelBorder)" stroke-width="1"/>
          <path d="M16 4a12 12 0 1012 12A12 12 0 0016 4zm5.5 13.5a1 1 0 01-1.4 0l-3.3-3.3a2.5 2.5 0 00-3.6 0l-1 1a1 1 0 01-1.4-1.4l1-1a4.5 4.5 0 016.4 0l3.3 3.3a1 1 0 010 1.4z" fill="#94A3B8" transform="scale(0.8) translate(4, 4)"/>
          <text x="44" y="21" class="value" font-size="13" fill="#94A3B8">LeetCode</text>
        </g>
        <g transform="translate(300, 20)">
          <circle cx="16" cy="16" r="16" fill="#1E293B" stroke="url(#panelBorder)" stroke-width="1"/>
          <path d="M12 6h8v2h-6v3h5v2h-5v3h6v2h-8V6zm10 0h2v12h-2V6z" fill="#94A3B8" transform="scale(0.8) translate(4, 4)"/>
          <text x="44" y="21" class="value" font-size="13" fill="#94A3B8">GeeksforGeeks</text>
        </g>
        <g transform="translate(485, 20)">
          <rect width="120" height="28" rx="14" fill="#10B981" fill-opacity="0.1" stroke="#10B981" stroke-width="1" stroke-opacity="0.3"/>
          <circle cx="16" cy="14" r="4" fill="#10B981"><animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/></circle>
          <text x="28" y="18" font-family="'JetBrains+Mono', monospace" font-weight="bold" font-size="11" fill="#34D399">READY TO BUILD</text>
        </g>
      </g>
    </g>
  </g>
</svg>
