<svg width="1180" height="610" viewBox="0 0 1180 610"
xmlns="http://www.w3.org/2000/svg">

<defs>

<!-- =========================
     COLOR GRADIENTS
========================= -->

<linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#7C3AED">
        <animate attributeName="stop-color"
        values="#7C3AED;#22D3EE;#10B981;#7C3AED"
        dur="8s"
        repeatCount="indefinite"/>
    </stop>

    <stop offset="50%" stop-color="#22D3EE">
        <animate attributeName="stop-color"
        values="#22D3EE;#10B981;#7C3AED;#22D3EE"
        dur="8s"
        repeatCount="indefinite"/>
    </stop>

    <stop offset="100%" stop-color="#10B981">
        <animate attributeName="stop-color"
        values="#10B981;#7C3AED;#22D3EE;#10B981"
        dur="8s"
        repeatCount="indefinite"/>
    </stop>
</linearGradient>


<linearGradient id="asciiGlow"
x1="0%" y1="0%"
x2="100%" y2="0%">

<stop offset="0%" stop-color="#22D3EE"/>
<stop offset="50%" stop-color="#A855F7"/>
<stop offset="100%" stop-color="#22D3EE"/>

<animateTransform
attributeName="gradientTransform"
type="translate"
from="-1 0"
to="1 0"
dur="5s"
repeatCount="indefinite"/>

</linearGradient>


<linearGradient id="glass"
x1="0%"
y1="0%"
x2="0%"
y2="100%">

<stop offset="0%"
stop-color="#FFFFFF"
stop-opacity=".12"/>

<stop offset="50%"
stop-color="#FFFFFF"
stop-opacity=".03"/>

<stop offset="100%"
stop-color="#FFFFFF"
stop-opacity=".08"/>

</linearGradient>


<radialGradient id="blue">

<stop offset="0%"
stop-color="#22D3EE"
stop-opacity=".28"/>

<stop offset="100%"
stop-color="#22D3EE"
stop-opacity="0"/>

</radialGradient>


<radialGradient id="purple">

<stop offset="0%"
stop-color="#7C3AED"
stop-opacity=".25"/>

<stop offset="100%"
stop-color="#7C3AED"
stop-opacity="0"/>

</radialGradient>



<!-- =========================
     FILTERS
========================= -->


<filter id="softGlow">

<feGaussianBlur
stdDeviation="6"
result="blur"/>

<feMerge>
<feMergeNode in="blur"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>

</filter>



<filter id="shadow">

<feGaussianBlur
stdDeviation="20"/>

</filter>



<filter id="noise">

<feTurbulence
type="fractalNoise"
baseFrequency="0.9"
numOctaves="2"/>

<feBlend
mode="soft-light"
in2="SourceGraphic"/>

</filter>



<clipPath id="round">

<rect
width="1180"
height="610"
rx="40"/>

</clipPath>


</defs>



<!-- =========================
     BACKGROUND
========================= -->


<g clip-path="url(#round)">


<rect
width="1180"
height="610"
fill="#030712"/>



<!-- FLOATING BACKGROUND LIGHTS -->


<circle
cx="120"
cy="80"
r="280"
fill="url(#blue)">

<animateTransform
attributeName="transform"
type="translate"
values="0 0;50 30;0 0"
dur="12s"
repeatCount="indefinite"/>

</circle>



<circle
cx="1030"
cy="530"
r="320"
fill="url(#purple)">

<animateTransform
attributeName="transform"
